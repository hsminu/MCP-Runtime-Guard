[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-runtime-guard"
version = "0.1.0"
description = "MCP Runtime Guard의 정책·실행·응답·승인 보안 코어"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.14.0", "jsonschema==4.26.0", "referencing==0.37.0"]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "hypothesis==6.169.0",
  "ruff==0.17.0",
  "mypy==2.4.0",
  "import-linter==2.15",
  "types-jsonschema==4.26.0.20261006",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
include = ["*.py", "*.pyi", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RET", "BLE", "S", "ASYNC", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
files = ["src/guard_app"]
native_parser = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
