; import-linter contracts (C2.9, C6.3; technical design ch. 2 dependency rules and 13.5).
; CI runs `lint-imports --config tools/ci/importlinter.ini`. Keep this file ASCII:
; import-linter reads it with the locale encoding (cp949/cp1252 on Windows).
; Static import checks do not prove there is no bypass; dynamic imports are
; covered by Semgrep and by the receive counts (design 9.4).

[importlinter]
root_package = guard_app
include_external_packages = True

[importlinter:contract:core-pure]
name = core imports only domain and the standard library
type = forbidden
source_modules =
    guard_app.core
forbidden_modules =
    guard_app.adapters
    guard_app.ports
    guard_app.security
    guard_app.servers
    guard_app.services
    guard_app.storage
    guard_app.ui
    mcp
    PySide6
    httpx
    openai
    sqlite3

[importlinter:contract:mcp-sdk-in-transport]
name = the MCP SDK is imported only by the transport adapter (I1)
type = forbidden
source_modules =
    guard_app
forbidden_modules =
    mcp
ignore_imports =
    guard_app.adapters.mcp_transport -> mcp
    guard_app.adapters.mcp_transport.** -> mcp
allow_indirect_imports = True

[importlinter:contract:layers]
name = layers: ui -> services -> core -> domain
type = layers
layers =
    guard_app.ui
    guard_app.services
    guard_app.core
    guard_app.domain

[importlinter:contract:ui-through-bridge]
name = ui does not reach storage, adapters or security directly (it goes through the bridge)
type = forbidden
source_modules =
    guard_app.ui
forbidden_modules =
    guard_app.adapters
    guard_app.core
    guard_app.ports
    guard_app.security
    guard_app.servers
    guard_app.storage
    mcp
    httpx
    openai
    sqlite3
allow_indirect_imports = True

[importlinter:contract:sqlite-in-storage]
name = sqlite3 is imported only by storage
type = forbidden
source_modules =
    guard_app
forbidden_modules =
    sqlite3
ignore_imports =
    guard_app.storage.** -> sqlite3
allow_indirect_imports = True

[importlinter:contract:subprocess-in-launcher]
name = subprocess is imported only by security.launcher
type = forbidden
source_modules =
    guard_app
forbidden_modules =
    subprocess
ignore_imports =
    guard_app.security.launcher -> subprocess
allow_indirect_imports = True

[importlinter:contract:http-clients-in-adapters]
name = HTTP client libraries are imported only by adapters
type = forbidden
source_modules =
    guard_app
forbidden_modules =
    httpx
    openai
ignore_imports =
    guard_app.adapters.** -> httpx
    guard_app.adapters.** -> openai
allow_indirect_imports = True
